name: CI/CD

on:
  push:
    branches: [main, refactor/cleanup-v15-only]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.ACR_REGISTRY }}

jobs:
  release-changes:
    name: Detect Complete Push Changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      cross_market: ${{ steps.changes.outputs.cross_market }}
      training: ${{ steps.changes.outputs.training }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the entire push range
        id: changes
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: >-
          python3 scripts/cross_market_release_changes.py
          --before "$PUSH_BEFORE" --after "$PUSH_AFTER"
          --github-output "$GITHUB_OUTPUT"

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    # Allow type errors for now (gradual type adoption)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run mypy
        run: uv run mypy src/ --ignore-missing-imports

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/unit -v --tb=short

  build-and-push:
    needs: [lint, test]
    # Build and push on main or refactor branch push (when ACR secrets are configured)
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/refactor/cleanup-v15-only') && github.event_name == 'push' && vars.ACR_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "mutable_tag=${{ env.REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/trading-service:latest" >> "$GITHUB_OUTPUT"
          else
            echo "mutable_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ steps.tag.outputs.mutable_tag }}
            ${{ env.REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/trading-service:${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-v15-image:
    name: Publish Current v15 Trading Image
    needs: [build-and-push]
    if: github.ref == 'refs/heads/refactor/cleanup-v15-only' && github.event_name == 'push' && vars.ACR_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: trading-v15-image-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the branch after the immutable build
        id: freshness
        run: >-
          python3 scripts/cross_market_release_changes.py
          --publish-if-current '${{ github.sha }}'
          --branch refactor/cleanup-v15-only --github-output "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        if: steps.freshness.outputs.publish_v15 == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Login to Alibaba Cloud ACR
        if: steps.freshness.outputs.publish_v15 == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Promote the exact current SHA image to test
        if: steps.freshness.outputs.publish_v15 == 'true'
        run: >-
          docker buildx imagetools create
          --tag '${{ env.REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/trading-service:test'
          '${{ env.REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/trading-service:${{ github.sha }}'

  deploy-serverless:
    needs: [lint, test, release-changes]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/refactor/cleanup-v15-only') && github.event_name == 'push' && vars.ACR_ENABLED == 'true' && needs.release-changes.outputs.training == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push serverless image
        uses: docker/build-push-action@v5
        with:
          context: ./serverless
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ml-training-serverless:latest
            ${{ env.REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ml-training-serverless:${{ github.sha }}
          cache-from: type=gha,scope=serverless
          cache-to: type=gha,mode=max,scope=serverless

      - name: Deploy to FC via Serverless Devs
        env:
          ACR_IMAGE: ${{ env.REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ml-training-serverless:${{ github.sha }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          npm install -g @serverless-devs/s
          s config add --AccessKeyID "${ALIBABA_CLOUD_ACCESS_KEY_ID}" --AccessKeySecret "${ALIBABA_CLOUD_ACCESS_KEY_SECRET}" -a default -f
          cd serverless
          sed -i "s|\${env.ACR_IMAGE}|${ACR_IMAGE}|g" s.yaml
          s deploy -y --use-local --skip-actions

  deploy-cross-market:
    name: Release v15 Index Infrastructure
    needs: [lint, test, build-and-push, release-changes]
    if: github.ref == 'refs/heads/refactor/cleanup-v15-only' && github.event_name == 'push' && vars.ACR_ENABLED == 'true' && needs.release-changes.outputs.cross_market == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: cross-market-v15-release
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build Linux Python dependency environments
        run: |
          uv python install 3.12 3.13
          uv venv --python 3.12 --seed worker-build-env
          uv venv --python 3.13 --seed collector-build-env
          uv venv --python 3.13 --seed deploy-env
          worker-build-env/bin/python -m pip install --no-compile --only-binary=:all: --target worker-vendor -r serverless/yahoo_indices/requirements.txt
          collector-build-env/bin/python -m pip install --no-compile --only-binary=:all: --target collector-vendor -r deploy/cross-market/requirements-fc.txt
          deploy-env/bin/python -m pip install --no-compile -r deploy/cross-market/requirements-deploy.txt

      - name: Build one revision of the worker and collectors
        run: >-
          deploy-env/bin/python deploy/cross-market/build_release.py
          --source-root . --revision '${{ github.sha }}' --output-dir release
          --worker-vendor worker-vendor --collector-vendor collector-vendor

      - name: Order, deploy and verify the same v15 revision
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.CROSS_MARKET_ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.CROSS_MARKET_ALIYUN_ACCESS_KEY_SECRET }}
          CROSS_MARKET_SSH_HOST: ${{ secrets.CROSS_MARKET_SSH_HOST }}
          CROSS_MARKET_SSH_USER: ${{ secrets.CROSS_MARKET_SSH_USER }}
          CROSS_MARKET_SSH_PASSWORD: ${{ secrets.CROSS_MARKET_SSH_PASSWORD }}
          CROSS_MARKET_SSH_KNOWN_HOSTS: ${{ secrets.CROSS_MARKET_SSH_KNOWN_HOSTS }}
          RUNTIME_IMAGE: ${{ env.REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/trading-service:${{ github.sha }}
        run: >-
          deploy-env/bin/python deploy/cross-market/deploy_release.py
          --release-dir release --source-root . --runtime-image "$RUNTIME_IMAGE"
          --remote-root /opt/ashare-cross-market
